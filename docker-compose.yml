services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: azure-stt-pii-backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      # The repository-root .env is not copied into the image, so every name the
      # README documents has to be forwarded explicitly. Anything missing here
      # silently falls back to a placeholder resource name and the run fails
      # against an endpoint that does not exist.
      AZURE_LANGUAGE_ENDPOINT: ${AZURE_LANGUAGE_ENDPOINT:-}
      AZURE_LANGUAGE_API_VERSION: ${AZURE_LANGUAGE_API_VERSION:-}
      AZURE_FOUNDRY_ENDPOINT: ${AZURE_FOUNDRY_ENDPOINT:-}
      AZURE_FOUNDRY_DEPLOYMENT: ${AZURE_FOUNDRY_DEPLOYMENT:-}
      AZURE_FOUNDRY_API_VERSION: ${AZURE_FOUNDRY_API_VERSION:-}
      AZURE_FOUNDRY_MAX_ATTEMPTS: ${AZURE_FOUNDRY_MAX_ATTEMPTS:-}
      AZURE_SPEECH_RESOURCE_NAME: ${AZURE_SPEECH_RESOURCE_NAME:-}
      AZURE_SPEECH_ENDPOINT: ${AZURE_SPEECH_ENDPOINT:-}
      AZURE_SPEECH_RESOURCE_ID: ${AZURE_SPEECH_RESOURCE_ID:-}
      AZURE_VOICE_LIVE_URL: ${AZURE_VOICE_LIVE_URL:-}
      AZURE_REQUEST_TIMEOUT_SECONDS: ${AZURE_REQUEST_TIMEOUT_SECONDS:-}
    volumes:
      # DefaultAzureCredential falls through to the Azure CLI, so the container
      # reuses the profile from `az login` on the host. Mounted read-write so the
      # CLI can refresh expired tokens mid-run.
      - ${HOME}/.azure:/root/.azure
      # Uploads and benchmark results survive container restarts.
      - ./var/uploads:/app/var/uploads
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: azure-stt-pii-frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BACKEND_URL: "http://backend:8000"
      PORT: "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
