<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STT benchmark</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Speech-to-text benchmark</h1>
      <p class="subtitle">
        Upload a call recording and, optionally, its reference transcript. Audio is
        transcribed by all three architectures concurrently; a reference transcript
        adds word error rate scoring.
      </p>
      <p id="backend-status" class="status-pill">checking backend…</p>
    </header>

    <main>
      <section class="card">
        <h2>New upload</h2>
        <form id="upload-form">
          <div class="fields">
            <label>
              <span>Audio <em>(wav, mp3, m4a, flac…)</em></span>
              <input type="file" id="audio-input" accept="audio/*,.wav,.mp3,.m4a,.flac,.ogg" />
            </label>
            <label>
              <span>Reference transcript <em>(.txt, optional)</em></span>
              <input type="file" id="transcript-input" accept=".txt,text/plain" />
            </label>
          </div>
          <div class="actions">
            <button type="submit" id="upload-button">Upload</button>
            <span id="upload-message" class="message"></span>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Uploads</h2>
        <div id="uploads"></div>
      </section>

      <section class="card">
        <h2>Benchmark runs</h2>
        <div id="jobs"></div>
      </section>
    </main>

    <script type="module" src="./app.ts"></script>
  </body>
</html>
